<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Заказы — DRIVEBOX</title><link rel="stylesheet" href="styles.css"><style>.admin-order{padding:22px;margin:18px 0;border:1px solid var(--line);border-radius:18px;overflow-wrap:anywhere}.admin-order p{margin:8px 0}.admin-actions{display:flex;gap:12px;flex-wrap:wrap}.admin-order select,#filter{padding:12px;background:var(--panel);color:var(--text);border-radius:8px}.admin-order summary{cursor:pointer;font-weight:700}#login{max-width:460px}.admin-order textarea{width:100%}</style></head><body><main class="container section"><h1>DRIVEBOX · Заказы</h1><form id="login" class="form-card"><div class="field"><label for="password">Пароль менеджера</label><input type="password" id="password" autocomplete="current-password" required></div><button class="btn primary">Войти</button></form><p id="message" role="status"></p><section id="dashboard" hidden><div class="admin-actions"><button id="refresh" class="btn secondary">Обновить</button><button id="export" class="btn secondary">Скачать CSV</button><button id="logout" class="btn secondary">Выйти</button><select id="filter"><option value="">Все статусы</option value="new">Новые</option><option value="confirmed">Подтверждённые</option><option value="shipped">Отправленные</option><option value="delivered">Доставленные</option><option value="cancelled">Отменённые</option></select></div><p id="readiness" class="notice"></p><details class="admin-order"><summary>Остатки товаров</summary><p>Укажите доступное к продаже количество. Уже оформленные заказы вычитаются при сохранении заказа.</p><form id="stock-form"><select id="stock-product" aria-label="Товар"></select><input id="stock-count" type="number" min="0" max="100000" required aria-label="Доступное количество"><button class="btn secondary">Сохранить остаток</button></form></details><div id="orders"></div></section></main><script src="admin.js"></script></body></html>
