<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayPal — DRIVEBOX</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header" data-depth=""></div><section class="section"><div class="container" style="max-width:720px"><div class="form-card"><h1>PayPal Checkout</h1><p class="muted">This page is wired for PayPal JS SDK after you insert a live Client ID in <code>config.js</code> and switch <code>testMode</code> to false.</p><div id="paypal-note" class="notice"></div><div id="paypal-buttons"></div></div></div></section><div id="site-footer" data-depth=""></div><script src="config.js"></script><script src="products.js"></script><script src="i18n.js"></script><script src="app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const c=getCart();let draft={};try{draft=JSON.parse(localStorage.getItem('drivebox_order_draft')||'{}')}catch{}const subtotal=c.reduce((sum,row)=>{const p=P.find(x=>x.id===row.id);return sum+p.price*row.qty},0);const total=Number(draft?.totals?.total||subtotal);const usd=(total/CFG.paypal.gelPerUsd).toFixed(2);document.getElementById('paypal-note').textContent=`Order total: ${total.toFixed(2)} GEL including configured delivery. PayPal checkout amount: about ${usd} USD using the configured manual FX rate. Update the rate before going live.`;if(!CFG.testMode&&!CFG.paypal.clientId.includes('REPLACE')){let s=document.createElement('script');s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(CFG.paypal.clientId)}&currency=${CFG.paypal.currency}`;s.onload=()=>paypal.Buttons({createOrder:(data,actions)=>actions.order.create({purchase_units:[{description:'DRIVEBOX order',amount:{value:usd,currency_code:CFG.paypal.currency}}]}),onApprove:(data,actions)=>actions.order.capture().then(()=>{localStorage.removeItem('drivebox_cart');document.getElementById('paypal-note').className='notice success';document.getElementById('paypal-note').textContent='Payment completed. Configure a server-side webhook/order store before production.'})}).render('#paypal-buttons');document.head.appendChild(s)}});
</script></body></html>
