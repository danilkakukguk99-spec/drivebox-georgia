<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — DRIVEBOX</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header" data-depth=""></div><section class="section"><div class="container"><h1 id="checkout-title"></h1><div class="checkout-grid"><form id="checkout-form" class="form-card"><div class="field"><label id="name-label"></label><input required name="name"></div><div class="field"><label id="phone-label"></label><input required name="phone" placeholder="+995"></div><div class="field"><label id="city-label"></label><input required id="city" name="city" value="Tbilisi"></div><div class="field"><label id="address-label"></label><input required name="address"></div><div class="field"><label id="delivery-label"></label><select id="delivery-method"><option value="same">Tbilisi same-day</option><option value="next">Tbilisi next-day / regions</option></select></div><div class="field"><label id="notes-label"></label><textarea name="notes" rows="3"></textarea></div><div class="notice" id="payment-note">PayPal checkout is prepared but disabled in test mode. GEL will be displayed on the site; PayPal should charge a supported currency such as USD.</div><button id="checkout-submit" class="btn primary" style="width:100%" type="submit"></button><div id="checkout-message" style="margin-top:12px"></div></form><aside class="order-card"><div id="cart-items"></div><div class="totals"><div class="total-line"><span id="subtotal-label"></span><b id="subtotal-val">0 ₾</b></div><div class="total-line"><span id="shipping-label"></span><b id="shipping-val">0 ₾</b></div><div class="total-line grand"><span id="total-label"></span><b id="total-val">0 ₾</b></div></div></aside></div></div></section><div id="site-footer" data-depth=""></div><script src="config.js"></script><script src="products.js"></script><script src="i18n.js"></script><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{checkoutTitle.textContent=t('checkout');document.getElementById('name-label').textContent=t('name');document.getElementById('phone-label').textContent=t('phone');document.getElementById('city-label').textContent=t('city');document.getElementById('address-label').textContent=t('address');document.getElementById('delivery-label').textContent=t('delivery');document.getElementById('notes-label').textContent=t('notes');document.getElementById('checkout-submit').textContent=t('order');document.getElementById('subtotal-label').textContent=t('subtotal');document.getElementById('shipping-label').textContent=t('shipping');document.getElementById('total-label').textContent=t('total')})</script></body></html>
